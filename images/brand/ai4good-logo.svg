<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 40" role="img" aria-label="AI4GOOD">
  <defs>
    <style>
      .wm { font-family: 'Muro', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 22px; letter-spacing: 0.5px; }
    </style>
  </defs>
  <!-- progress-ring mark: green in upper-right (12–3 o'clock) -->

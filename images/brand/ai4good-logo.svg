    <circle cx="0" cy="0" r="13.5" fill="none" stroke="#308858" stroke-width="2.6"
      stroke-linecap="round" stroke-dasharray="21 63.8" transform="rotate(-90)"/>
  </g>
  <text x="40" y="26.5" class="wm">
    <tspan fill="#1c1e24">AI4</tspan><tspan fill="#308858">GOOD</tspan>
